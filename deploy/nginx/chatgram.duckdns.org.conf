# =============================================================================
# nginx site — chatgram.duckdns.org
# =============================================================================
# Install:
#   sudo cp deploy/nginx/chatgram.duckdns.org.conf \
#            /etc/nginx/sites-available/chatgram.duckdns.org
#   sudo ln -sf /etc/nginx/sites-available/chatgram.duckdns.org \
#               /etc/nginx/sites-enabled/chatgram.duckdns.org
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file starts HTTP-ONLY on purpose. certbot --nginx will edit it in place
# and add the TLS server block, the certificate paths and the HTTP->HTTPS
# redirect. Do not add TLS by hand first or certbot will get confused.
#
# The Flutter web app is hosted on Vercel, so nginx only ever proxies the API
# and the uploaded media. It serves no static files.
# =============================================================================

# Only send "Connection: upgrade" when the client actually asked to upgrade.
# Sending it unconditionally breaks ordinary keep-alive requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chatgram.duckdns.org;

    # --- Let's Encrypt HTTP-01 challenge -------------------------------------
    # Must be served over plain HTTP before a certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- API + Socket.IO -----------------------------------------------------
    location / {
        # The Node process from ecosystem.config.js. PORT in .env is 5000.
        proxy_pass http://127.0.0.1:5000;

        # --- WebSocket upgrade (Socket.IO) ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # --- correct client identity behind the proxy ---
        # app.set('trust proxy', 1) in server.js makes Express honour these.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # --- long-lived connections ---
        # 86400s = 24h. nginx's default 60s closes idle WebSockets, which shows
        # up as "socket disconnects after about a minute".
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        # Streaming both ways; required for voice notes / image uploads.
        proxy_buffering off;
        proxy_request_buffering off;

        # --- uploads ---
        # Must be >= MAX_FILE_SIZE in server/.env (26214400 bytes = 25 MB).
        client_max_body_size 25m;
        client_body_timeout 300s;
    }

    # Do not leak the nginx version.
    server_tokens off;
}
