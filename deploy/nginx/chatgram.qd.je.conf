# =============================================================================
# nginx site — chatgram.qd.je
# =============================================================================
# Static mirror of the Vercel Build Output bundle (landing + /web/ React app +
# /docs/), served from the Oracle VM in parallel with the existing
# https://chatgram-xi.vercel.app deployment. It does NOT replace or touch the
# chatgram.duckdns.org vhost: that file keeps proxying the API and serving
# /downloads exactly as before.
#
# Install (from the repo root, on the VM):
#   sudo cp deploy/nginx/chatgram.qd.je.conf /etc/nginx/sites-available/chatgram.qd.je
#   sudo ln -sf /etc/nginx/sites-available/chatgram.qd.je \
#               /etc/nginx/sites-enabled/chatgram.qd.je
#   sudo nginx -t && sudo systemctl reload nginx
#
# The site content is uploaded by scripts/deploy-web-vm.ps1 into
# /var/www/chatgram-site with: upload -> /var/www/chatgram-site.new, verify,
# move the old dir to /var/www/chatgram-site.old, then move the new dir in.
# A failed upload therefore never leaves a half-written site.
#
# HTTP ONLY on purpose. TLS is added by certbot AFTER the chatgram.qd.je A
# record points at this VM (see the marked placeholder at the bottom). Do not
# add listen 443 / ssl_certificate by hand first: certbot would get confused.
# =============================================================================

# Socket.IO needs "Connection: upgrade" only when the client asked for it.
# A separate variable name keeps this file independent from the duckdns vhost.
map $http_upgrade $qd_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name chatgram.qd.je;

    # Compression: nginx only gzips text/html by default, but this site is one
    # large HTML document plus one CSS and one JS file, so the rest is added here.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/xml+rss;

    root /var/www/chatgram-site;
    index index.html;

    server_tokens off;

    # Same limits/headers the duckdns block uses for uploads and long-lived
    # sockets, so the mirrored site behaves identically.
    client_max_body_size 60m;
    client_body_timeout 300s;

    # Mirrors the Permissions-Policy the Vercel deployment sends on every path.
    # add_header does not inherit into locations that set their own headers, so
    # it is repeated in each location below that sets add_header.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Let's Encrypt HTTP-01 challenge -------------------------------------
    # Must stay reachable over plain HTTP; the certificate step uses it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- /app -> /web/ (Vercel redirect: permanent=false -> 307) -------------
    location = /app {
        return 307 /web/;
    }
    location ^~ /app/ {
        return 307 /web/;
    }

    # --- /web/ : SPA fallback + noindex (Vercel route /web(/.*)?) ------------
    location = /web {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /web/index.html =404;
    }
    location ^~ /web/static/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /web/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # SPA fallback: /web/admin and every other client route load the shell.
        try_files $uri $uri/ /web/index.html;
    }

    # --- landing assets: the same cache TTLs the Vercel routes use -----------
    location ^~ /static/ {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- API + Socket.IO: proxied to the same Node process -------------------
    # Same target, headers and timeouts as the duckdns vhost; without these the
    # long-lived WebSocket disconnects after 60s.
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $qd_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 60m;
        client_body_timeout 300s;
    }

    # --- /downloads/ : served straight from disk ----------------------------
    # alias + nginx's native Range support keeps the 82 MB Windows installer
    # resumable; no proxy, no app memory.
    location /downloads/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition "attachment";
        alias /var/www/downloads/;
        autoindex off;
        default_type application/octet-stream;
    }

    # --- /docs : static files with an index fallback -------------------------
    location = /docs {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /docs/index.html =404;
    }
    location ^~ /docs/ {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /docs/index.html;
    }

    # --- /rw, /fr, /sw : Vercel rewrites these to their index.html (200) -----
    # nginx would otherwise 301 to the trailing-slash form; Vercel returns 200.
    location = /rw {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /rw/index.html =404;
    }
    location = /fr {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /fr/index.html =404;
    }
    location = /sw {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /sw/index.html =404;
    }

    # --- everything else: real files from the bundle, 404.html otherwise -----
    location / {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # =========================================================================
    # TLS PLACEHOLDER — do not uncomment by hand.
    # After the chatgram.qd.je A record points at this VM, the certificate step
    # is exactly:
    #
    #     sudo certbot --nginx -d chatgram.qd.je --redirect
    #
    # certbot will add these lines to THIS server block (and the HTTP->HTTPS
    # redirect server block it creates):
    #
    #     listen 443 ssl; # managed by Certbot
    #     listen [::]:443 ssl ipv6only=on; # managed by Certbot
    #     ssl_certificate /etc/letsencrypt/live/chatgram.qd.je/fullchain.pem; # managed by Certbot
    #     ssl_certificate_key /etc/letsencrypt/live/chatgram.qd.je/privkey.pem; # managed by Certbot
    #     include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    #
    # Until then this host answers on port 80 only and is reachable with a Host
    # header test (see scripts/deploy-web-vm.ps1).
    # =========================================================================

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chatgram.qd.je/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chatgram.qd.je/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = chatgram.qd.je) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot


}
