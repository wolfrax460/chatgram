<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatgram — no connection</title>
    <meta name="theme-color" content="#0b141a" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0b141a;
        color: #e9edef;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        /* Safe areas: keeps the text off the status/navigation bars on phones
           with a notch or gesture bar. */
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
      }
      .card { max-width: 420px; text-align: center; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
        background: #111b21; display: flex; align-items: center; justify-content: center;
      }
      h1 { font-size: 20px; line-height: 1.3; margin: 0 0 10px; font-weight: 600; }
      p { margin: 0 0 20px; color: #8696a0; font-size: 15px; line-height: 1.5; }
      button {
        min-height: 48px; padding: 12px 24px; border-radius: 999px; border: 0;
        background: #00a884; color: #0b141a; font-size: 16px; font-weight: 600; cursor: pointer;
      }
      button:active { background: #029e7b; }
      .hint { margin-top: 18px; font-size: 13px; color: #667781; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H9l-5 4V5.5Z"
                fill="#00a884"/>
        </svg>
      </div>
      <h1>Can&rsquo;t reach Chatgram</h1>
      <p>Check your mobile data or Wi-Fi, then try again. Your chats stay on the server and will be here when you are back online.</p>
      <button type="button" onclick="retryNow()">Try again</button>
      <p class="hint" id="status" aria-live="polite">Retrying automatically…</p>
    </div>
    <script>
      // Capacitor's `server.errorPath` loads this page (a local file, no network
      // needed) when the hosted web client cannot be fetched, instead of leaving
      // the user with a blank white WebView. It re-tries the real app by itself.
      var TARGET = 'https://chatgram-xi.vercel.app/web/';
      var attempts = 0;

      function retryNow() {
        attempts += 1;
        document.getElementById('status').textContent = 'Trying again…';
        try {
          window.location.replace(TARGET);
        } catch (e) {
          window.location.href = TARGET;
        }
      }

      var timer = setInterval(function () {
        if (attempts >= 12) {
          clearInterval(timer);
          document.getElementById('status').textContent =
            'Still offline. Tap "Try again" when you have a connection.';
          return;
        }
        retryNow();
      }, 10000);
    </script>
  </body>
</html>
