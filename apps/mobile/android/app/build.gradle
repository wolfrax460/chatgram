apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// The sideloaded APK must always be signed with the SAME key. Android refuses
// an update whose signature differs ("App not installed"), so this build uses
// the machine's standard debug keystore (~/.android/debug.keystore), the key the
// existing 1.1.0 APK was signed with. Gradle silently CREATES a new debug
// keystore when the file is missing, which would change the certificate and
// break every future update - so fail loudly instead.
// Backup instructions: docs/android-build.md ("Debug keystore").
// ---------------------------------------------------------------------------
def debugKeystoreFile = new File(System.getProperty('user.home'), '.android/debug.keystore')
if (!debugKeystoreFile.exists()) {
    throw new GradleException(
        "Missing debug keystore: ${debugKeystoreFile}\n" +
        "Restore the backup of the original file. Do NOT continue with a freshly " +
        "generated keystore: already-installed Chatgram apps would refuse the update " +
        "(signature mismatch). See docs/android-build.md."
    )
}

android {
    namespace "app.chatgram.android"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.chatgram.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Every published APK MUST increase versionCode, otherwise Android
        // refuses the update ("App not installed"). 1.1.1/2 was the broken
        // launch build; 1.1.2/3 was the first published-fixed build; 1.1.3/4
        // adds the in-app updater (chunk 7C); 1.1.4/5 makes the finish/verify
        // path reliable (Android 8+ blocks manifest DOWNLOAD_COMPLETE); 1.1.5/6
        // adds new-message notifications (NotifierPlugin).
        versionCode 6
        versionName "1.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Fast, unminified build for `gradlew assembleDebug` while debugging.
            minifyEnabled false
        }
        release {
            // Direct-download build: R8 + resource shrinking keep the APK small,
            // and it is signed with the debug key on purpose (no release
            // keystore, not published on the Play Store).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    // Release lint walks the whole app and can fail a sideload build for
    // warnings that do not affect behaviour; keep the build deterministic.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Chunk 7C: periodic (~12 h) update check that also runs when the app is closed.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
