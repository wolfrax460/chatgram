// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        // FCM (round 1.1.7): processes app/google-services.json into the Firebase
        // resources (google_app_id etc.) that FirebaseApp/FCM initialise from.
        // The credentials file is gitignored; app/build.gradle applies this plugin
        // only when the file is present, so a checkout without it still builds.
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
