# Gradle / Android build memory settings for a 12 GB Windows PC.
#
# The build used to die on this machine with
#   "Could not close incremental caches .../kotlin" / "Java heap space"
# because Gradle, the Kotlin daemon and Android Studio's own daemon were all
# asking for the 8 GB defaults at the same time. These limits keep the whole
# build inside ~2 GB, so it also runs while Android Studio (2 GB heap) is open.
#
# Raise to -Xmx2g only if nothing else is using the machine.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Keep resource use predictable on a shared/low-memory dev machine.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# R8 in full mode is the default for AGP 8.x; be explicit so a future AGP bump
# does not silently change shrinking behaviour.
android.enableR8.fullMode=true
