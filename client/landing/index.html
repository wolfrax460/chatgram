<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatgram — Simple, reliable messaging</title>
  <meta name="description" content="Chatgram is a fast, private messaging app for Android, Windows and the web. Real-time chat, voice notes, photos, groups and status updates." />
  <meta name="theme-color" content="#008069" />

  <meta property="og:title" content="Chatgram — Simple, reliable messaging" />
  <meta property="og:description" content="Chat on Android, Windows or right in your browser." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />

  <!-- Set the theme BEFORE first paint so dark-mode users see no white flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('chatgram-theme');
        var theme = saved && saved !== 'system'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
