# Gradle / Kotlin memory settings.
#
# The Flutter template defaults to `-Xmx8G -XX:MaxMetaspaceSize=4G`, which asks
# for 12 GB before the separate Kotlin daemon even starts. On a machine with
# 11.7 GB of RAM that starves the Kotlin daemon and the build dies with:
#
#   "Could not close incremental caches in ...caches-jvm/jvm/kotlin"
#
# These values are sized to leave headroom on an 8-16 GB machine. If you have
# plenty of RAM, `-Xmx4g -XX:MaxMetaspaceSize=1g` is a safe upper bound.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Run the Kotlin compiler inside the Gradle daemon instead of spawning a second
# JVM. This is the biggest win on low-memory machines and avoids daemon OOMs.
kotlin.compiler.execution.strategy=in-process

# The Kotlin incremental cache is what failed under memory pressure. Disabling
# it costs a little build time but makes builds deterministic and repeatable.
kotlin.incremental=false

# Keep resource use predictable on a shared/low-memory dev machine.
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
