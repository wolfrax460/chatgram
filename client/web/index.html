<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chatgram — a cross-platform messaging app.">

  <!-- Makes the web build behave like a responsive app on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chatgram">
  <meta name="theme-color" content="#008069">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chatgram</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f7f5f2;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #008069;
      gap: 18px;
    }
    #loading .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(0, 128, 105, 0.25);
      border-top-color: #008069;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0b141a; }
      #loading { color: #25d366; }
      #loading .spinner {
        border-color: rgba(37, 211, 102, 0.25);
        border-top-color: #25d366;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading Chatgram…</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the HTML splash once the Flutter engine has painted.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
  </script>
</body>
</html>
